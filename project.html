<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="index,follow">
<title>Project — Brickmen</title>
<style>
:root{--ink:#171915;--muted:#777970;--line:#dedfd9;--paper:#f5f5f1;--orange:#e45b2b}
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:#fff;font-family:Inter,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}
header{display:flex;align-items:center;justify-content:space-between;padding:23px clamp(22px,5vw,80px);border-bottom:1px solid var(--line)}.logo{font-size:30px;font-weight:750;letter-spacing:-.04em}.logo span{color:var(--orange)}.back{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;border-bottom:1px solid #aeb0a8;padding-bottom:6px}
main{max-width:1600px;margin:auto}.hero{display:grid;grid-template-columns:1.15fr .85fr;min-height:520px;background:#242720;color:white}.hero-media{min-height:520px;background:#dedfd9}.hero-media img{width:100%;height:100%;min-height:520px;object-fit:cover;display:block}.hero-copy{padding:clamp(30px,6vw,90px);display:flex;flex-direction:column;justify-content:flex-end}.eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#c0c2b9}.hero h1{font-size:clamp(42px,6vw,88px);line-height:.96;letter-spacing:-.07em;font-weight:520;margin:23px 0}.meta{font-size:12px;line-height:1.8;color:#d2d4cc}.intro{max-width:880px;margin:0 auto;padding:80px 28px 72px;display:grid;grid-template-columns:160px minmax(0,1fr);gap:34px}.intro-label{font-size:10px;text-transform:uppercase;letter-spacing:.15em;color:var(--muted);font-weight:700}.intro p{font-size:clamp(16px,1.8vw,21px);line-height:1.75;color:#52564d;margin:0;white-space:pre-wrap}
.gallery{padding:0 clamp(16px,4vw,64px) 70px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.gallery figure{margin:0;background:#eee;overflow:hidden}.gallery figure:first-child{grid-column:1/-1}.gallery img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block}.gallery figure:first-child img{aspect-ratio:2.2/1}.gallery figcaption{padding:10px 12px;font-size:10px;color:#65685f}.end{background:var(--paper);padding:42px 24px;text-align:center;font-size:10px;text-transform:uppercase;letter-spacing:.18em;color:#85887f}.error{padding:100px 24px;text-align:center;color:var(--muted)}
@media(max-width:760px){header{padding:18px 18px}.logo{font-size:24px}.hero{grid-template-columns:1fr}.hero-media,.hero-media img{min-height:300px;max-height:430px}.hero-copy{min-height:280px}.intro{grid-template-columns:1fr;gap:15px;padding:45px 24px}.gallery{grid-template-columns:1fr;padding:0 12px 45px}.gallery figure:first-child{grid-column:auto}.gallery figure:first-child img{aspect-ratio:16/10}}
</style>
</head>
<body>
<header><a class="logo" href="/">Brickmen<span>.</span></a><a class="back" href="/#work">Back to selected work ↗</a></header>
<main id="page"><div class="error">Loading project…</div></main>
<script>
(function(){
'use strict';
var slug=new URLSearchParams(location.search).get('slug');
var host=document.getElementById('page');
function esc(value){return String(value===null||value===undefined?'':value).replace(/[&<>"']/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];});}
fetch('/api/portfolio',{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('Portfolio unavailable');return r.json();}).then(function(data){
 var p=(data.projects||[]).find(function(x){return x.slug===slug;});
 if(!p){host.innerHTML='<div class="error"><h1>Project unavailable</h1><p>This project may be unpublished or the link may be incorrect.</p><a href="/#work">Return to selected work</a></div>';return;}
 var media=(p.media||[]).slice().sort(function(a,b){return Number(b.is_cover)-Number(a.is_cover)||Number(a.sort_order||0)-Number(b.sort_order||0);});
 var cover=media.find(function(x){return x.is_cover;})||media[0];
 var meta=[p.location,p.category,p.project_year].filter(Boolean).join(' · ');
 host.innerHTML='<section class="hero"><div class="hero-media">'+(cover?'<img src="'+esc(cover.url)+'" alt="'+esc(cover.alt_text||p.title)+'">':'')+'</div><div class="hero-copy"><div class="eyebrow">BRICKMEN / SELECTED WORK</div><h1>'+esc(p.title||'Project')+'</h1><div class="meta">'+esc(meta)+'</div></div></section>'+
 (p.description?'<section class="intro"><div class="intro-label">Project note</div><p>'+esc(p.description)+'</p></section>':'')+
 '<section class="gallery">'+media.filter(function(x){return x!==cover;}).map(function(item){return '<figure><img src="'+esc(item.url)+'" alt="'+esc(item.alt_text||p.title)+'" loading="lazy">'+(item.caption?'<figcaption>'+esc(item.caption)+'</figcaption>':'')+'</figure>';}).join('')+'</section>'+
 '<div class="end">Brickmen · Design that looks ahead</div>';
 document.title=(p.title||'Project')+' — Brickmen';
 }).catch(function(){host.innerHTML='<div class="error">The project could not be loaded right now.</div>';});
})();
</script>
</body>
</html>
